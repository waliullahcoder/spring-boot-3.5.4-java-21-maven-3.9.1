# ===============================
# = DATA SOURCE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/javaaccountingdb?useSSL=false&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=always

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = Flyway Migration (this section for migration from src/main/resources/db/migration/V1__create_users_table.sql)
# ===============================
#spring.flyway.enabled=false
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true

# ===============================
# = JWT Security (custom property)
# ===============================
security.jwt.secret=my-super-secret-key
security.jwt.expiration=3600000   # 1 hour in ms

# ===============================
# = Server / Logging
# ===============================
server.port=8080
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG

