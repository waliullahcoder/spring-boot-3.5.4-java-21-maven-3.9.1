spring:
  datasource:
    url: jdbc:mysql://localhost:3306/javaaccountingdb
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # for dev; use 'validate' or migrations (Flyway) in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

# JWT secret for security module
security:
  jwt:
    secret: my-super-secret-key
    expiration: 3600000  # 1 hour
